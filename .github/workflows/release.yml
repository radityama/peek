name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: Publish to npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # registry-url creates an empty NODE_AUTH_TOKEN entry that can mask OIDC.
      - run: npm install --global npm@11.19.0
      - run: npm --version
      - name: Verify tag and package identity
        run: |
          node -e "const p = require('./package.json'); const tag = process.env.GITHUB_REF_NAME; const expected = p.name === '@radityprtama/peek' ? 'v' + p.version + '-legacy' : p.name === '@usepeek/peek' ? 'v' + p.version : undefined; if (!expected || tag !== expected) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack:check
      - run: pnpm smoke:pack
      - name: Verify previously published v0.2.2
        if: github.ref_name == 'v0.2.2'
        run: |
          pack_dir=$(mktemp -d)
          mkdir -p "$pack_dir/local" "$pack_dir/registry"
          npm pack --pack-destination "$pack_dir/local" --silent
          npm pack @usepeek/peek@0.2.2 --pack-destination "$pack_dir/registry" --silent
          mkdir -p "$pack_dir/local/unpacked" "$pack_dir/registry/unpacked"
          tar -xzf "$pack_dir/local"/*.tgz -C "$pack_dir/local/unpacked"
          tar -xzf "$pack_dir/registry"/*.tgz -C "$pack_dir/registry/unpacked"
          diff -qr "$pack_dir/local/unpacked/package" "$pack_dir/registry/unpacked/package"
      - name: Publish with provenance
        if: github.ref_name != 'v0.2.2'
        run: npm publish --provenance --access public --loglevel=verbose
